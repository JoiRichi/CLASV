name: clasv_env
channels:
  - bioconda
  - conda-forge
dependencies:
  - python>=3.7,<3.13
  - pip
  - curl
  # Core scientific stack; let conda resolve compatible builds for the given python
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - biopython
  - matplotlib
  # External CLI tools
  - nextclade
  - seqkit
